<script>
// Seamlessly inject Jobs App navigation link into Primary Navigation rail
(function() {
  function injectJobsNav() {
    const nav = document.getElementById("nav");
    if (nav && !nav.querySelector('a[href="/jobs"]')) {
      const a = document.createElement("a");
      a.href = "/jobs";
      a.setAttribute("data-app", "jobs");
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span>Jobs App</span><span class="badge" style="background:#38bdf8;color:#0f172a;font-weight:700;">15</span>';
      if (nav.children.length >= 2) {
        nav.insertBefore(a, nav.children[2]);
      } else {
        nav.appendChild(a);
      }
    }
  }
  const obs = new MutationObserver(injectJobsNav);
  const nav = document.getElementById("nav");
  if (nav) obs.observe(nav, { childList: true });
  window.addEventListener("DOMContentLoaded", injectJobsNav);
  window.addEventListener("load", injectJobsNav);
  injectJobsNav();
})();
</script>
